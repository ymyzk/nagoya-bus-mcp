version: 2
updates:
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      monthly-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      monthly-major:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      monthly-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      monthly-major:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      monthly-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      monthly-major:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      monthly-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      monthly-major:
        patterns:
          - "*"
        update-types:
          - "major"
